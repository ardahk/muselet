[project]
name = "brain"
version = "0.1.0"
description = "On-device macOS agent: brain (orchestrator, router, planner)"
readme = "README.md"
authors = [
    { name = "Arda Hoke", email = "hoke@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "dateparser==1.4.3",
    "huggingface-hub[hf-xet]>=2.3.0",
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "mlx-vlm==0.7.8",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "tinker-cookbook==0.5.7",
    "websockets==17.2",
]

[project.optional-dependencies]
decisions = [
    "httpx==0.28.1",
]
tinker = [
    "tinker==0.34.0",
]

[project.scripts]
brain = "brain.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "transformers==5.20.2",
]
