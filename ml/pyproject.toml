[project]
name = "m0-speed-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arda Hoke", email = "hoke@berkeley.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub[hf-xet]>=2.3.0",
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "mlx-vlm==0.7.8",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
m0-speed-lab = "m0_speed_lab:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
